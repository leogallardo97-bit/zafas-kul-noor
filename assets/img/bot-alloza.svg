<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Lámina botánica de la alloza o almendra verde (Prunus dulcis): rama de almendro con hojas lanceoladas aserradas, fruto verde aterciopelado entero y alloza abierta mostrando la semilla blanca inmadura">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description rdf:about="">
        <dc:title>Alloza · Almendra verde (Prunus dulcis) · Lámina botánica</dc:title>
        <dc:creator><rdf:Seq><rdf:li>Restaurante Noor</rdf:li></rdf:Seq></dc:creator>
        <dc:rights>Autoría: Restaurante Noor · Dirección y supervisión: Paco Morales y Paola Gualandi</dc:rights>
        <dc:description>Alloza, almendra verde (Prunus dulcis, allawza). Lámina botánica · Recreación visual de la propuesta (imagen de síntesis)</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f8f8f2"/>
      <stop offset="100%" stop-color="#e5eadf"/>
    </radialGradient>
    <radialGradient id="hull" cx="38%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#9bc495"/>
      <stop offset="55%" stop-color="#4e8c62"/>
      <stop offset="100%" stop-color="#28593c"/>
    </radialGradient>
    <linearGradient id="almondLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d9b6e"/>
      <stop offset="100%" stop-color="#265c3e"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" fill="url(#bg)"/>
  <rect x="10" y="10" width="220" height="220" rx="6" fill="none" stroke="#2a1d22" stroke-opacity=".22" stroke-width="1"/>
  <rect x="14" y="14" width="212" height="212" rx="4" fill="none" stroke="#2c6e4f" stroke-opacity=".18" stroke-width=".7"/>
  <g fill="#2c6e4f" fill-opacity=".45">
    <circle cx="18" cy="18" r="1.6"/><circle cx="222" cy="18" r="1.6"/>
    <circle cx="18" cy="222" r="1.6"/><circle cx="222" cy="222" r="1.6"/>
  </g>

  <!-- Rama leñosa de almendro (Prunus dulcis) -->
  <path d="M30,46 C72,62 118,82 172,112 C188,121 200,128 210,136" fill="none" stroke="#5b4338" stroke-width="5" stroke-linecap="round"/>
  <path d="M30,46 C72,62 118,82 172,112 C188,121 200,128 210,136" fill="none" stroke="#2a1d22" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Hojas lanceoladas estrechas con margen finamente aserrado y nervadura pinnada -->
  <g stroke="#2a1d22" stroke-width="1.15" stroke-linejoin="round">
    <g transform="translate(76,65) rotate(-52)">
      <path d="M0,0 C-11,-16 -12,-46 0,-72 C12,-46 11,-16 0,0 Z" fill="url(#almondLeaf)"/>
      <path d="M0,0 L0,-68 M0,-16 L-7,-26 M0,-26 L7,-36 M0,-36 L-7,-46 M0,-46 L6,-55" fill="none" stroke="#c3decb" stroke-width=".85" stroke-linecap="round"/>
    </g>
    <g transform="translate(142,95) rotate(-38)">
      <path d="M0,0 C-12,-18 -13,-50 0,-78 C13,-50 12,-18 0,0 Z" fill="url(#almondLeaf)"/>
      <path d="M0,0 L0,-74 M0,-18 L-8,-28 M0,-28 L8,-39 M0,-39 L-7,-50 M0,-50 L6,-60" fill="none" stroke="#c3decb" stroke-width=".85" stroke-linecap="round"/>
    </g>
    <g transform="translate(176,114) rotate(24)">
      <path d="M0,0 C-10,-15 -11,-42 0,-64 C11,-42 10,-15 0,0 Z" fill="#3f7d4f"/>
      <path d="M0,0 L0,-60 M0,-14 L-6,-23 M0,-24 L6,-33 M0,-34 L-5,-43" fill="none" stroke="#c3decb" stroke-width=".8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Alloza entera (drupa verde aterciopelada con surco longitudinal y ápice mucronado) -->
  <g transform="translate(88,72) rotate(16)" stroke="#2a1d22" stroke-width="1.3">
    <path d="M0,0 C-24,10 -32,44 -20,76 C-12,94 -2,104 4,108 C12,100 26,82 28,54 C30,24 18,4 0,0 Z" fill="url(#hull)"/>
    <!-- Surco ventral característico del exocarpo verde -->
    <path d="M2,4 C-10,28 -12,64 2,102" fill="none" stroke="#1e442e" stroke-width="1.1" stroke-dasharray="1 0"/>
    <!-- Punteado suave del vello aterciopelado (tomento) -->
    <g fill="#d5e8da" stroke="none" opacity=".65">
      <circle cx="-12" cy="34" r="1"/><circle cx="-6" cy="48" r=".9"/><circle cx="-14" cy="58" r="1"/>
      <circle cx="10" cy="30" r="1"/><circle cx="16" cy="46" r=".9"/><circle cx="12" cy="64" r="1"/>
      <circle cx="4" cy="78" r=".9"/><circle cx="-6" cy="74" r="1"/>
    </g>
  </g>

  <!-- Alloza abierta longitudinalmente (primer plano abajo a la derecha): exocarpo verde, endocarpo tierno color miel claro y semilla blanca lechosa -->
  <g transform="translate(148,118) rotate(-14)" stroke="#2a1d22" stroke-width="1.3">
    <!-- Exocarpo verde carnoso cortado -->
    <path d="M0,0 C-24,10 -30,44 -18,74 C-10,92 -1,100 4,104 C12,96 24,78 26,52 C28,24 16,4 0,0 Z" fill="#2c6e4f"/>
    <!-- Mesocarpo verde claro en el corte -->
    <path d="M0,6 C-19,14 -24,44 -14,70 C-7,86 0,93 4,96 C10,89 20,73 21,51 C22,27 13,10 0,6 Z" fill="#c7dec5" stroke-width="1"/>
    <!-- Endocarpo incipiente (futuro hueso) aún tierno en tono melado suave -->
    <path d="M0,15 C-13,22 -16,44 -9,64 C-4,76 1,82 4,85 C8,79 15,66 16,49 C17,31 10,18 0,15 Z" fill="#dfc082" stroke="#a8741f" stroke-width="1.1"/>
    <!-- Semilla tierna y gelatinosa (almendra cuajada blanca marfileña) -->
    <path d="M0,22 C-9,28 -11,45 -6,60 C-2,70 1,75 4,77 C7,72 11,61 12,48 C13,34 8,25 0,22 Z" fill="#fbfaf5" stroke="#2a1d22" stroke-width="1"/>
    <path d="M1,28 C-3,40 -3,55 3,71" fill="none" stroke="#d9cfbe" stroke-width=".9" stroke-linecap="round"/>
  </g>
</svg>
